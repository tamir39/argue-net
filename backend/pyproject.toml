[project]
name = "arguenet-backend"
version = "0.1.0"
description = "ArgueNet backend — multi-agent Jarvis (CLI & FastAPI)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "google-generativeai>=0.8",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.20",
    "faster-whisper>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
